  - attack_technique: T1069
    iso_27001_annex_a: ["A.5.18"]
    zt_pillar: identity

  - attack_technique: T1484
    iso_27001_annex_a: ["A.5.16", "A.8.9"]
    zt_pillar: governance

# Tool-source hints: which tool(s) typically surface evidence for each pillar.
# Used by report.py to explain *why* a pillar's coverage looks the way it does,
# and to flag pillars no configured tool actually covers yet.
pillar_tool_coverage:
  identity: [pingcastle, prowler, caldera]
  devices: [openscap, atomic, caldera]
  networks: [caldera, atomic, prowler]
  applications_workloads: [prowler, openscap]
  data: [prowler, openscap]
  visibility_analytics: [caldera, atomic]
  automation_orchestration: []   # no configured tool yet - known gap, see README
  governance: []                 # largely GRC-platform / documentation-driven, see README
